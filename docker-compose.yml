services:
  web:
    build: .
    container_name: chi-tieu-web
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # DB nam trong volume /app/data (xem DATABASE_URL o Dockerfile)
      - DATABASE_URL=sqlite:////app/data/chi-tieu.db
    volumes:
      - app-data:/app/data
    restart: unless-stopped

# ----------------------------------------------------------------
