version: "3.8"

services:
  api:
    build: .
    container_name: chi-tieu-api
    ports:
      - "8000:8000"
    # Khoi dong db truoc, va chi chay api khi db DA SAN SANG
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Ten host la "db" (ten service), KHONG phai localhost
      # Ghi de bang file .env (da .gitignore) neu muon dung mat khau that
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:123456@db:5432/chitieu_db}
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: chi-tieu-db
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456}
      - POSTGRES_DB=chitieu_db
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    # Kiem tra db thuc su san sang tiep nhan ket noi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg-data:
