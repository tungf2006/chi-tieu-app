[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chi-tieu-app"
version = "2.1.0"
description = "Personal expense tracker: FastAPI backend + Streamlit frontend with spending forecasts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "statsmodels",
    "requests",
    "psycopg2-binary",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["app"]
